# Install at /opt/backend/podman-compose.yml (root:root 0644).
#
# Backend (DeSo node) podman-compose definition. The image tag is NOT baked into
# this file: /opt/backend/deploy.sh pulls the requested tag and writes the single
# line `IMAGE=ghcr.io/forked-social/backend:<tag>` to /opt/backend/.deploy. The
# systemd unit (backend.service) loads that file via `EnvironmentFile=`, exporting
# $IMAGE into the environment podman-compose inherits, which is why the image
# below is `${IMAGE}`. If $IMAGE is unset the `:?` guard makes compose abort with
# an explanatory message. deploy.sh consumes this file exactly as:
#     podman-compose -f /opt/backend/podman-compose.yml down
#     podman-compose -f /opt/backend/podman-compose.yml up -d
#
# PERSISTENCE: deploy.sh's down/up recreates the container on every deploy, so
# all state that must survive lives in the bind mounts below, and
# /opt/backend/.env (loaded via env_file) points the node at the mount targets:
#     host /opt/backend/data/chain  <- badger chain DB + checkpoints  (/data)
#     host /opt/backend/data/logs   <- glog *.INFO/*.WARNING/...      (/logs)
# Pre-create the data dirs deploy-owned once (deploy cannot create entries in
# the root-owned service dir):
#     sudo install -d -o deploy -g deploy -m 0755 /opt/backend/data/chain /opt/backend/data/logs
services:
  backend:
    image: ${IMAGE:?IMAGE not set — run deploy.sh, which writes /opt/backend/.deploy}
    container_name: backend
    pull_policy: never              # deploy.sh already podman-pulled the exact tag
    restart: unless-stopped         # process-crash restart within a boot; systemd handles reboot
    env_file:
      - .env                        # DATA_DIR=/data, LOG_DIR=/logs (+ optional flags)
    volumes:
      - /opt/backend/data/chain:/data
      - /opt/backend/data/logs:/logs
    #
    # --- forked-social seed node port publishing ---------------------------
    # Protocol (P2P) port 42000 must be reachable from the internet so peers
    # can connect (node.forked.social:42000). The API port 42001 is published
    # on loopback only — terminate TLS on the host reverse proxy that serves
    # https://node.forked.social. For the testnet-style seed use 42420/42421.
    ports:
      - "42000:42000"             # P2P protocol port (fork mainnet)
      - "127.0.0.1:42001:42001"   # REST/RPC (API_PORT=42001, reverse-proxied)
    # environment:
    #   - DESO_CONFIG=/config/config.json
    # volumes (additional):
    #   - /opt/backend/config:/config:ro        # node JSON config (root-owned, read-only)
