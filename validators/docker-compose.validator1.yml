# forked-social PoS VALIDATOR 1 — podman-compose definition.
#
# Install at /opt/validator1/docker-compose.validator1.yml (root:root 0644).
# This file mirrors backend/podman-compose.yml (the SEED node) so both run the
# same backend image with the same volume/convention layout:
#     host /opt/validator1/data/chain  <- badger chain DB + checkpoints  (/data)
#     host /opt/validator1/data/logs   <- glog *.INFO/*.WARNING/...      (/logs)
# Pre-create the data dirs once:
#     sudo install -d -o deploy -g deploy -m 0755 /opt/validator1/data/chain /opt/validator1/data/logs
#
# IMAGE: same convention as the seed — the tag is NOT baked in. Pull the same
# tag the seed runs and export it, e.g.:
#     podman pull ghcr.io/forked-social/backend:<tag>
#     IMAGE=ghcr.io/forked-social/backend:<tag> \
#       podman-compose -f /opt/validator1/docker-compose.validator1.yml up -d
# Filenames: validator2 and validator3 use docker-compose.validator2.yml /
# docker-compose.validator3.yml with /opt/validatorN/... paths. All three
# validators run on the SAME server as the seed node, so each publishes its
# OWN port pair: validator1 42100/42101, validator2 42200/42201,
# validator3 42300/42301 (seed keeps 42000/42001).
#
# ⚠️ SECRETS: POS_VALIDATOR_SEED lives in validator1.env (next to this file,
# 0600, runtime-injected). It is validator 1's BLS mnemonic and MUST be the
# SAME mnemonic the bootstrap script consumed as VALIDATOR1_BLS_SEED when it
# registered the validator on-chain (see backend/scripts/pos/validator_bootstrap/
# and backend/validators/README.md). NEVER commit it.
services:
  validator1:
    image: ${IMAGE:?IMAGE not set — podman pull the backend tag and export IMAGE}
    container_name: validator1
    pull_policy: never              # operator podman-pulled the exact tag
    restart: unless-stopped         # process-crash restart within a boot; systemd handles reboot
    env_file:
      - validator1.env              # DATA_DIR=/data, LOG_DIR=/logs, POS_VALIDATOR_SEED=... (0600!)
    environment:
      # --- fixed forked-social network wiring (mirror of the seed node) ---
      FORKNET: "true"                                 # fork mainnet params (FS1…, default ports 42000/42001)
      PROTOCOL_PORT: "42100"                          # P2P inside the container (default 42000 — distinct per validator, shared host)
      API_PORT: "42101"                               # REST/RPC inside the container
      CONNECT_IPS: node.forked.social:42000           # persistent link to the seed (DNS seeds are empty by design)
      CHECKPOINT_SYNCING_PROVIDERS: https://node.forked.social
    volumes:
      - /opt/validator1/data/chain:/data
      - /opt/validator1/data/logs:/logs
    #
    # --- ports -----------------------------------------------------------------
    # P2P 42100 MUST be publicly reachable: the validator mesh dials the domain
    # registered on-chain for this validator — node.forked.social:42100
    # (covered by the existing node.forked.social DNS record; distinct ports
    # keep the listeners apart — see README). The API port 42101 is
    # published on loopback only, for admin access over SSH port-forwarding:
    #   ssh -L 42101:127.0.0.1:42101 <server>   then curl 127.0.0.1:42101
    ports:
      - "42100:42100"             # P2P protocol port (fork mainnet) — PUBLIC
      - "127.0.0.1:42101:42101"   # REST/RPC (API_PORT=42101) — loopback/admin only
